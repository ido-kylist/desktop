appId: com.cleon.desktop
productName: Cleon
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned on purpose until a Developer ID certificate exists. Shipping an
  # unsigned build with a documented xattr step is honest; faking a signature is not.
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

publish:
  provider: github
  owner: ido-kylist
  repo: desktop
