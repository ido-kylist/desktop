name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macos-latest, not macos-14: on this private repo the arm64 runner label
    # resolves to an unsupported configuration and the job is cancelled in
    # seconds (observed on the first CI run). The DMG is cross-built for arm64,
    # which is the conventional path when an arm64 runner is unavailable.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and publish DMG
        # arm64 cross-build: electron-builder rebuilds better-sqlite3 for the
        # target arch. CI verifies host-arch packaging on every push; this job
        # produces the shippable Apple Silicon DMG on a tag.
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by design until a Developer ID certificate exists. Never fake it.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
