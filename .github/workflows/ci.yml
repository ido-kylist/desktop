name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · test · e2e
    # macos-latest, not a pinned arm64 label: on a private repo the arm64 runner
    # label resolves to an unavailable configuration and the job is cancelled in
    # seconds. Arch-specific release builds belong to the release workflow.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test

      - name: Electron end-to-end
        run: npx playwright test

      - name: Package (no publish)
        # Host arch: CI proves the packaging pipeline works end to end. The arm64
        # DMG is produced by the release workflow on a matching runner.
        run: pnpm exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: cleon-dmg
          path: release/*.dmg
          if-no-files-found: error
